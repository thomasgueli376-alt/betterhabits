name: Beaty reminders
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: beaty-reminders
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due reminders
        shell: bash
        run: |
          response=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fbetterhabits-beta.vercel.app%2Fapi%2Fbeaty-notifications")
          token=$(jq -er .value <<<"$response")
          echo "::add-mask::$token"
          curl --fail --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            --data '{"action":"dispatch"}' \
            https://betterhabits-beta.vercel.app/api/beaty-notifications
